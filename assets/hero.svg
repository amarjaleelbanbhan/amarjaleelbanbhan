<svg width="900" height="320" viewBox="0 0 900 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B11"/>
      <stop offset="0.55" stop-color="#0A1420"/>
      <stop offset="1" stop-color="#0D1B2A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D9FF"/>
      <stop offset="0.5" stop-color="#7B61FF"/>
      <stop offset="1" stop-color="#00FFA3"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-900 0; 900 0; -900 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="name" x1="176" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D9FF"/>
      <stop offset="0.5" stop-color="#7B9CFF"/>
      <stop offset="1" stop-color="#00FFA3"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7B61FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7B61FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FFA3" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00FFA3" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="term"><rect x="150" y="52" width="600" height="212" rx="12"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" rx="16" fill="url(#bg)"/>

  <!-- Ambient orbs -->
  <circle cx="120" cy="60" r="170" fill="url(#orb1)">
    <animate attributeName="cx" values="120;190;120" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="250" r="190" fill="url(#orb2)">
    <animate attributeName="cy" values="250;190;250" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="70" r="140" fill="url(#orb3)">
    <animate attributeName="cx" values="820;760;820" dur="14s" repeatCount="indefinite"/>
  </circle>

  <!-- Grid lines -->
  <g stroke="#16233A" stroke-width="1" opacity="0.55">
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="225" y1="0" x2="225" y2="320"/>
    <line x1="450" y1="0" x2="450" y2="320"/>
    <line x1="675" y1="0" x2="675" y2="320"/>
  </g>

  <!-- Neural network constellation (right side) -->
  <g stroke="#00D9FF" stroke-width="1" opacity="0.35">
    <line x1="800" y1="90" x2="850" y2="140"/>
    <line x1="850" y1="140" x2="795" y2="185"/>
    <line x1="795" y1="185" x2="855" y2="220"/>
    <line x1="800" y1="90" x2="795" y2="185"/>
    <line x1="850" y1="140" x2="855" y2="220"/>
    <line x1="770" y1="130" x2="850" y2="140"/>
    <line x1="770" y1="130" x2="795" y2="185"/>
  </g>
  <g fill="#00FFA3">
    <circle cx="800" cy="90" r="3.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="140" r="3" fill="#00D9FF"><animate attributeName="opacity" values="1;0.4;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="795" cy="185" r="3.5" fill="#7B61FF"><animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="855" cy="220" r="3" fill="#00D9FF"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="770" cy="130" r="2.5" fill="#00FFA3"><animate attributeName="opacity" values="1;0.4;1" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Terminal window (glass) -->
  <g>
    <rect x="150" y="52" width="600" height="212" rx="12" fill="#0B1017" fill-opacity="0.92" stroke="#1F2A3A" stroke-width="1.5"/>
    <rect x="150" y="52" width="600" height="34" rx="12" fill="#131A24"/>
    <rect x="150" y="74" width="600" height="12" fill="#131A24"/>
    <circle cx="174" cy="69" r="6" fill="#FF5F57"/>
    <circle cx="194" cy="69" r="6" fill="#FEBC2E"/>
    <circle cx="214" cy="69" r="6" fill="#28C840"/>
    <text x="450" y="74" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="12" fill="#5C6B7F">amar@jaleel: ~/build</text>

    <!-- Scanline sweep -->
    <g clip-path="url(#term)">
      <rect x="150" y="52" width="600" height="34" fill="#00D9FF" opacity="0.06">
        <animate attributeName="y" values="52;264;52" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Terminal content -->
    <g font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="15">
      <text x="176" y="116" fill="#00FFA3">➜</text>
      <text x="196" y="116" fill="#8B98A9">whoami</text>
      <text x="176" y="146" fill="url(#name)" font-size="27" font-weight="bold" filter="url(#glow)">AMAR JALEEL</text>

      <text x="176" y="178" fill="#00FFA3">➜</text>
      <text x="196" y="178" fill="#8B98A9">cat role.txt</text>

      <!-- Rotating roles -->
      <g font-size="16" font-weight="600" filter="url(#softglow)">
        <text x="176" y="206" fill="#00D9FF" opacity="0">AI Product Engineer
          <animate attributeName="opacity" values="0;1;1;0;0;0;0" dur="9s" repeatCount="indefinite"/></text>
        <text x="176" y="206" fill="#7B61FF" opacity="0">LLM Security Researcher
          <animate attributeName="opacity" values="0;0;0;1;1;0;0" dur="9s" repeatCount="indefinite"/></text>
        <text x="176" y="206" fill="#00FFA3" opacity="0">Data Storyteller
          <animate attributeName="opacity" values="0;0;0;0;0;1;1" dur="9s" repeatCount="indefinite"/></text>
      </g>
      <g font-size="16" font-weight="600">
        <text x="176" y="206" fill="#00D9FF" opacity="0">AI Product Engineer
          <animate attributeName="opacity" values="0;1;1;0;0;0;0" dur="9s" repeatCount="indefinite"/></text>
        <text x="176" y="206" fill="#7B61FF" opacity="0">LLM Security Researcher
          <animate attributeName="opacity" values="0;0;0;1;1;0;0" dur="9s" repeatCount="indefinite"/></text>
        <text x="176" y="206" fill="#00FFA3" opacity="0">Data Storyteller
          <animate attributeName="opacity" values="0;0;0;0;0;1;1" dur="9s" repeatCount="indefinite"/></text>
      </g>

      <!-- Blinking cursor -->
      <rect x="176" y="220" width="10" height="18" fill="#00D9FF">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
      <text x="196" y="235" fill="#3A4657" font-size="13">npm CLIs · VS Code extensions · voice agents · full-stack</text>
    </g>
  </g>

  <!-- Animated bottom accent bar + moving highlight -->
  <rect x="0" y="314" width="900" height="6" fill="url(#accent)"/>
  <rect x="0" y="314" width="120" height="6" fill="#FFFFFF" opacity="0.35">
    <animate attributeName="x" values="-120;900;-120" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner brackets -->
  <g stroke="#00D9FF" stroke-width="2.5" opacity="0.9" fill="none">
    <path d="M20 44 V22 H42"/>
    <path d="M858 22 H880 V44"/>
    <path d="M880 276 V298 H858"/>
    <path d="M42 298 H20 V276"/>
  </g>
</svg>
